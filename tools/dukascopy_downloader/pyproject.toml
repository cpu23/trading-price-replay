[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dukascopy-downloader"
version = "0.2.0"
description = "Audited Dukascopy tick and candle downloader."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dukascopy-download = "dukascopy_downloader.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
