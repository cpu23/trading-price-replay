[project]
name = "trading-price-replay-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "polars>=1.20",
  "pyarrow>=18",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3", "ruff>=0.12"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

