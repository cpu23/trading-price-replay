[project]
name = "trading-price-replay-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
  "polars>=1.20",
  "pyarrow>=18",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

